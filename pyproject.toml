[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tripmate"
version = "3.0.0"
description = "Production-grade multi-agent travel planner: LangGraph, LiteLLM gateway, FastAPI, Gradio, PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  # --- API / UI ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "gradio>=5.0",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "PyJWT>=2.9",
  "python-multipart>=0.0.12",
  # --- agents / LLM gateway ---
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "litellm>=1.60",
  # --- persistence ---
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.14",
  # --- data ---
  "airportsdata>=20250101",
  "tzdata>=2024.2",          # IANA zones on Windows / slim images
  # --- observability ---
  "structlog>=24.4",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
scale = ["redis>=5.2", "arq>=0.26"]
observability = ["langfuse>=3.0", "sentry-sdk[fastapi]>=2.19"]
sqlite = ["aiosqlite>=0.20"]   # zero-setup local development only
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "anyio>=4.6",
  "fakeredis>=2.26",
  "aiosqlite>=0.20",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
]

[project.scripts]
tripmate-api = "tripmate.main:run_api"
tripmate-worker = "tripmate.main:run_worker"
tripmate-eval = "tripmate.evals.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tripmate"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF", "C4", "PIE", "PT"]
ignore = [
  "E501",    # line length is handled by the formatter
  "S101",    # asserts are fine in tests; production code does not use them for control flow
  "RUF012",  # mutable class attributes in pydantic models
  "UP046", "UP047",  # TypeVar generics are kept for mypy/pydantic compatibility
  "PT006",
  "B008",    # FastAPI Depends() in defaults is the idiom
  "RUF001", "RUF002", "RUF003",  # typographic punctuation in prose is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT011", "PT018", "E702", "E741", "RUF059", "SIM117", "C416", "B015"]
"migrations/**" = ["I001"]
"src/tripmate/evals/**" = ["S311"]
"src/tripmate/resilience/**" = ["S311"]   # jitter does not need a CSPRNG
"src/tripmate/providers/**" = ["S311"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["^migrations/"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers -p anyio.pytest_plugin"
markers = [
  "integration: needs a real service (Postgres/Redis) - run in CI service containers",
  "live: calls real LLM/data APIs; never run by default",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["src/tripmate"]
branch = true
omit = ["src/tripmate/ui/*", "src/tripmate/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.bandit]
exclude_dirs = ["tests"]
